name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  code-quality-and-test:
    name: Code Quality, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: ml-serving-capstone
        run: uv sync --frozen

      - name: Run Ruff Linter
        working-directory: ml-serving-capstone
        run: uv run ruff check .

      - name: Run Mypy Static Type Analysis
        working-directory: ml-serving-capstone
        run: uv run mypy src/

      - name: Run Pytest
        working-directory: ml-serving-capstone
        run: uv run pytest

  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint ml-infra Chart
        run: helm lint helm/ml-infra

      - name: Lint ml-app Chart
        run: helm lint helm/ml-app

  publish-artifacts-and-gitops-sync:
    name: Publish Artifacts & Trigger GitOps
    needs: [code-quality-and-test, helm-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Dynamic Version Variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="0.1.${{ github.run_number }}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ml-serving-capstone
          file: ml-serving-capstone/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ml-serving-capstone:sha-${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/ml-serving-capstone:v${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}/ml-serving-capstone:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Log in Helm to GHCR OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package & Push OCI Helm Charts to GHCR
        run: |
          mkdir -p .dist
          # Package ml-infra chart
          helm package helm/ml-infra --version ${{ steps.vars.outputs.version }} --app-version ${{ steps.vars.outputs.version }} -d .dist
          helm push .dist/ml-infra-${{ steps.vars.outputs.version }}.tgz oci://ghcr.io/${{ github.repository }}/charts

          # Package ml-app chart
          helm package helm/ml-app --version ${{ steps.vars.outputs.version }} --app-version ${{ steps.vars.outputs.version }} -d .dist
          helm push .dist/ml-app-${{ steps.vars.outputs.version }}.tgz oci://ghcr.io/${{ github.repository }}/charts

      - name: Update GitOps Workload Manifest (Pin to Immutable SHA)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/tag: .*/tag: \"sha-${{ steps.vars.outputs.short_sha }}\"/" helm/ml-app/values.yaml
          git add helm/ml-app/values.yaml
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): bump ml-app image tag to sha-${{ steps.vars.outputs.short_sha }} [skip ci]"
            git push origin main
          fi
