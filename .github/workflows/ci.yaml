name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  code-quality-and-test:
    name: Code Quality, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: ml-serving-capstone
        run: uv sync --frozen

      - name: Run Ruff Linter
        working-directory: ml-serving-capstone
        run: uv run ruff check .

      - name: Run Mypy Static Type Analysis
        working-directory: ml-serving-capstone
        run: uv run mypy src/

      - name: Run Pytest
        working-directory: ml-serving-capstone
        run: uv run pytest

  build-and-publish-image:
    name: Build & Publish Container Image
    needs: code-quality-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Dynamic Version Variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="0.1.${{ github.run_number }}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ml-serving-capstone
          file: ml-serving-capstone/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ml-serving-capstone:sha-${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ github.repository }}/ml-serving-capstone:v${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}/ml-serving-capstone:latest

      - name: Trigger GitOps Update (Optional cross-repo writeback)
        if: env.GITOPS_TOKEN != ''
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/project-one-gitops.git gitops-repo
          cd gitops-repo
          sed -i "s/tag: .*/tag: \"sha-${{ steps.vars.outputs.short_sha }}\"/" helm/ml-app/values.yaml
          git add helm/ml-app/values.yaml
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): bump ml-app image tag to sha-${{ steps.vars.outputs.short_sha }}"
            git push origin main
          fi
