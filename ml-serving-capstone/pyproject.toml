[project]
name = "ml-serving-capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shantanu Sharma", email = "shantanu.sharma@sentinelone.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "fastapi>=0.128.8",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.5",
    "redis>=7.0.1",
    "scikit-learn>=1.6.1",
    "uvicorn>=0.39.0",
]

[project.scripts]
ml-serving-capstone = "ml_serving_capstone:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
ignore = ["BLE001"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "aiokafka.*"]
ignore_missing_imports = true
